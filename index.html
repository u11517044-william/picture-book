<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>互動繪本電子書</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">

    <!-- 上方：標題與閱讀位置提示 -->
    <header id="topbar">
      <h1 class="title">📚 繪本故事</h1>
      <div id="page-indicator" aria-live="polite">第 1 / 20 頁</div>
    </header>

    <!-- 中間：繪本舞台（左右為翻頁按鈕） -->
    <main id="stage">
      <button id="prev-btn" class="nav-btn nav-left" aria-label="上一頁"><img src="graphics/left.jpg" alt="上一頁"></button>

      <div id="book">
        <!-- 起始載入第 0 頁；補上 handleImageLoad 與 handleImageError 監聽 -->
        <img id="page-image" src="graphics/0.jpg" alt="繪本第 1 頁" onload="if(typeof handleImageLoad==='function')handleImageLoad()" onerror="if(typeof handleImageError==='function')handleImageError()">

        <!-- 載入中提示 -->
        <div id="loading-indicator">載入中...</div>

        <!-- 素材載入失敗提示 -->
        <div id="error-message" style="display:none;">素材載入失敗 <button id="retry-btn">重試</button></div>
      </div>

      <button id="next-btn" class="nav-btn nav-right" aria-label="下一頁"><img src="graphics/right.jpg" alt="下一頁"></button>
    </main>

    <!-- 進度條 -->
    <div id="progress"><div id="progress-bar"></div></div>

    <!-- 下方：功能列 -->
    <footer id="toolbar">
      <button id="read-btn" class="tool-btn" aria-label="朗讀"><img src="graphics/read.jpg" alt="朗讀"></button>
      <button id="spirit-btn" class="tool-btn" aria-label="靜音控制"><img src="graphics/spirit.png" alt="精靈"></button>
      <button id="debug-btn" style="display:none;" aria-label="除錯">Debug</button>
    </footer>

    <!-- 一般提示訊息與除錯面板 -->
    <div id="toast" hidden></div>
    <pre id="debug-panel" hidden></pre>
  </div>

  <script src="app.js"></script>
</body>
</html>
